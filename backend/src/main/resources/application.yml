server:
  port: 8080

spring:
  application:
    name: product-show-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/product_show?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:product_show}
    password: ${SPRING_DATASOURCE_PASSWORD:product_show_pass}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  token-style: uuid
  jwt-secret-key: ${SA_TOKEN_SECRET:change-me-in-production}

wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
